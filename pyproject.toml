[project]
name = "zapit"
version = "2.0.0"
description = "Scanning opto-stimulation for head-fixed mouse behaviour: Python core, PyQt6 GUI, ZeroMQ server for Bonsai"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Coen Lab, UCL" },
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "pyzmq>=25",
]

[project.optional-dependencies]
gui = ["PyQt6>=6.6", "pyqtgraph>=0.13.7"]
ni = ["nidaqmx>=1.0"]
basler = ["pypylon>=3.0"]
all = ["zapit[gui,ni,basler]"]

[project.scripts]
zapit = "zapit.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "PyQt6>=6.6",
    "pyqtgraph>=0.13.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zapit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
